[tools]
rust = "1.92.0"

[tasks.test]
description = "Run the test suite"
run = "cargo test"

[tasks.release]
description = "Bump the version, test, commit Cargo version files, tag, and push"
usage = 'arg "<version>" help="Release version without a leading v (for example, 0.1.0)"'
run = '''
#!/usr/bin/env bash
set -euo pipefail

version="${usage_version:?}"
if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
  echo "Version must be a valid release version without a leading v"
  exit 1
fi
version_check_dir="$(mktemp -d)"
trap 'rm -rf "$version_check_dir"' EXIT
printf '[package]\nname = "lazyagents-version-check"\nversion = "%s"\nedition = "2021"\n\n[workspace]\n' "$version" > "$version_check_dir/Cargo.toml"
mkdir "$version_check_dir/src"
: > "$version_check_dir/src/lib.rs"
if ! cargo metadata --manifest-path "$version_check_dir/Cargo.toml" --no-deps --format-version 1 >/dev/null 2>&1; then
  echo "Version must be valid for Cargo"
  exit 1
fi

if [[ "$(git branch --show-current)" != "main" ]]; then
  echo "Release must run from branch main"
  exit 1
fi
if [[ -n "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)" ]]; then
  echo "Release requires a clean tracked and untracked worktree"
  exit 1
fi
git fetch --tags origin '+refs/heads/main:refs/remotes/origin/main'
if [[ "$(git rev-parse HEAD)" != "$(git rev-parse refs/remotes/origin/main)" ]]; then
  echo "Local main must match origin/main"
  exit 1
fi
if git rev-parse --verify "refs/tags/v$version" >/dev/null 2>&1; then
  echo "Local tag v$version already exists"
  exit 1
fi
if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
  echo "Remote tag v$version already exists"
  exit 1
else
  remote_tag_status=$?
  if [[ "$remote_tag_status" -ne 2 ]]; then
    echo "Could not verify whether remote tag v$version exists"
    exit 1
  fi
fi

VERSION="$version" perl -0pi -e 's/^version = "[^"]+"/version = "$ENV{VERSION}"/m' Cargo.toml

cargo_version="$(cargo metadata --no-deps --format-version 1 | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')"
if [[ "$cargo_version" != "$version" ]]; then
  echo "Cargo.toml version is $cargo_version, expected $version"
  exit 1
fi
cargo fmt --all -- --check
cargo clippy --all-targets --all-features --locked -- -D warnings
cargo test --all-targets --locked

git add Cargo.toml Cargo.lock
if ! git diff --quiet HEAD -- Cargo.toml Cargo.lock; then
  git commit -m "chore(release): v$version" -- Cargo.toml Cargo.lock
fi
git tag -a "v$version" -m "v$version"
git push --atomic origin HEAD:main "refs/tags/v$version"
'''
