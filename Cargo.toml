[package]
name = "mews"
version = "0.0.1"
edition = "2021"

[dependencies]
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
serde_yaml = "0.9"
tempfile = "3"
walkdir = "2"
zip = "0.6"
ratatui = "0.28"
crossterm = "0.27"
clap = { version = "4", features = ["derive"] }
